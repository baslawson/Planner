// Classes the Compose compiler should treat as stable, so a composable that takes one can skip
// recomposition by comparing values (equals) rather than instances.
//
// Without this the compiler infers instability. Strong skipping still lets those composables skip,
// but it compares such a parameter by instance, so every database emission - Room builds fresh Trip
// and ItineraryItem objects each time - recomposes every row on screen, including the rows whose
// contents did not change.
//
// Everything listed here must really be immutable, or hold only observable (snapshot) state. A
// mutable object listed here would be changed without the UI noticing.
// Comments must start with // ; a # is a parse error.

// Immutable value types. java.time predates the annotation, so the compiler cannot tell.
java.time.*

// The read-only collection interfaces. The app never hands a composable a plain list and then
// mutates it in place; the lists it does mutate are SnapshotStateList, which stays observable.
kotlin.collections.*

// The data layer: Room entities (all val), the search index and outcome, the backup snapshots, and
// the singletons (AttachmentStore, the repositories) whose own state lives in flows.
com.example.itinerary.data.*

// The Nextcloud screen's state holder: a data class of vals, unstable only for its List field.
com.example.itinerary.ui.NextcloudUiState
